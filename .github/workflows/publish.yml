name: Publish to Maven Central

on:
  release:
    types: [ published ]

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run library unit tests & lint
        run: ./gradlew :core:test :core:lint

      - name: Check required secrets
        run: |
          missing_secrets=()
          if [ -z "${MAVEN_CENTRAL_USERNAME}" ]; then missing_secrets+=("MAVEN_CENTRAL_USERNAME"); fi
          if [ -z "${MAVEN_CENTRAL_PASSWORD}" ]; then missing_secrets+=("MAVEN_CENTRAL_PASSWORD"); fi
          if [ -z "${SIGNING_KEY}" ]; then missing_secrets+=("SIGNING_KEY"); fi
          if [ -z "${SIGNING_PASSWORD}" ]; then missing_secrets+=("SIGNING_PASSWORD"); fi

          if [ ${#missing_secrets[@]} -ne 0 ]; then
            echo "::error::Missing required repository secret(s): ${missing_secrets[*]}"
            exit 1
          fi
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD || secrets.SIGNING_PASSWORD }}

      - name: Determine release version
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          echo "RELEASE_VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Publish to Maven Central
        run: ./gradlew :core:publishAndReleaseToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD || secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_VERSION_NAME: ${{ steps.version.outputs.RELEASE_VERSION }}

